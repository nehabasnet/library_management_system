<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Member — LMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #e8ddd0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

    .topbar {
      background: #5c3d2e; padding: 12px 28px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-left .logo-icon {
      width: 36px; height: 36px; background: #8b5e3c; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.1rem;
    }
    .topbar-left span { font-size: 0.95rem; font-weight: 600; color: #fff; }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      background: #8b5e3c; border: none; padding: 7px 14px;
      border-radius: 8px; font-size: 0.82rem; color: #fff;
      text-decoration: none; transition: background 0.15s;
    }
    .back-btn:hover { background: #a0714f; color: #fff; }

    .page-body { max-width: 620px; margin: 32px auto; padding: 0 20px; }

    .form-card {
      background: #fff; border-radius: 16px;
      padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .form-card h4 {
      font-size: 1.2rem; font-weight: 700; color: #3d1f0f;
      margin-bottom: 24px; display: flex; align-items: center; gap: 8px;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      font-size: 0.75rem; font-weight: 600; color: #5c3d2e;
      text-transform: uppercase; letter-spacing: 0.4px;
      display: block; margin-bottom: 5px;
    }
    .form-input {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #e0d5c8; border-radius: 8px;
      font-size: 0.88rem; color: #1a1a2e;
      background: #faf8f5; outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: #8b5e3c; background: #fff; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .btn-save {
      background: #8b5e3c; color: #fff; border: none;
      padding: 11px 28px; border-radius: 8px;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-save:hover { background: #6b4226; }
    .btn-cancel {
      background: #f0e8df; color: #5c3d2e; border: none;
      padding: 11px 24px; border-radius: 8px;
      font-size: 0.9rem; text-decoration: none;
      transition: background 0.15s;
    }
    .btn-cancel:hover { background: #e0d5c8; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo-icon"><i class="bi bi-book-half"></i></div>
    <span>Library Management System</span>
  </div>
  <a href="{% url 'member_management' %}" class="back-btn">
    <i class="bi bi-arrow-left"></i> Back to Members
  </a>
</div>

<div class="page-body">
  <div class="form-card">
    <h4>
      <i class="bi bi-pencil-square" style="color:#8b5e3c;"></i>
      Edit Member
    </h4>

    <form method="POST">
      {% csrf_token %}

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" name="full_name" class="form-input"
                 value="{{ student.full_name }}" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Student ID *</label>
          <input type="text" name="student_id" class="form-input"
                 value="{{ student.student_id }}" required/>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input type="email" name="email" class="form-input"
                 value="{{ student.email }}" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Phone *</label>
          <input type="text" name="phone" class="form-input"
                 value="{{ student.phone }}" required/>
        </div>
      </div>

      <div style="display:flex;gap:12px;margin-top:8px;">
        <button type="submit" class="btn-save">
          <i class="bi bi-check-circle-fill me-1"></i> Save Changes
        </button>
        <a href="{% url 'member_management' %}" class="btn-cancel">Cancel</a>
      </div>
    </form>
  </div>
</div>

</body>
</html>
