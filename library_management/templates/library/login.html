{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'library/css/login.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
    --primary: #1E3A5F;
    --primary-dark: #162d4a;
    --accent: #0EA5E9;
    --accent-dark: #0284C7;
    --bg: #F1F5F9;
    --card: #ffffff;
    --text: #1E293B;
    --muted: #64748B;
    --border: #E2E8F0;
    --success: #22C55E;
    --warning: #F59E0B;
    --danger: #EF4444;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  /* ── Utilities ── */
  .hidden { display: none !important; }
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .gap-4 { gap: 16px; }
  .gap-5 { gap: 20px; }
  .flex-1 { flex: 1; }
  .w-full { width: 100%; }
  .relative { position: relative; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .space-y-4 > * + * { margin-top: 16px; }
  .space-y-5 > * + * { margin-top: 20px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
  .grid-4-books { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }

    /* ── Auth screens ── */
  .auth-screen {
    display: flex;
    justify-content: center; 
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #0F2544 0%, #1E3A5F 50%, #0c3460 100%);
    align-items: center; justify-content: center; padding: 16px;
    flex-direction: column;
  }
  .auth-logo {
    width: 64px; height: 64px;
    background: rgba(14,165,233,0.2);
    border: 1px solid rgba(14,165,233,0.3);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
  }
  .auth-logo svg { width: 32px; height: 32px; color: #0EA5E9; }
  .auth-title { color: white; font-size: 22px; font-weight: 800; text-align: center; }
  .auth-subtitle { color: rgba(255,255,255,0.45); font-size: 13px; text-align: center; margin-top: 4px; }
  .auth-card {
    background: white; border-radius: 18px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    padding: 28px; width: 100%; max-width: 400px; margin-top: 28px;
  }
  .auth-card-wide { max-width: 420px; }

  /* ── Form elements ── */
  .form-group { margin-bottom: 0; }
  .form-label {
    display: block; font-size: 11px; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px;
  }
  .form-input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: #F8FAFC;
    font-size: 14px; color: var(--text); outline: none;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,0.15); background: white; }
  .form-input.error { border-color: var(--danger); background: #FFF5F5; }
  .form-input:read-only { background: #F1F5F9; color: var(--muted); cursor: not-allowed; }
  .form-input-wrap { position: relative; }
  .form-input-wrap .form-input { padding-right: 38px; }
  .input-right-btn {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--muted);
    display: flex; align-items: center; padding: 0;
  }
  .input-right-btn:hover { color: var(--text); }
  .form-error { color: var(--danger); font-size: 11px; margin-top: 4px; }
  .form-select {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: #F8FAFC;
    font-size: 14px; color: var(--text); outline: none; cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,0.15); }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
    border: none; cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 4px 12px rgba(30,58,95,0.3); }
  .btn-accent { background: var(--accent); color: white; }
  .btn-accent:hover { background: var(--accent-dark); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-ghost:hover { background: var(--bg); }
  .btn-success { background: #16a34a; color: white; }
  .btn-success:hover { background: #15803d; }
  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }
  .btn-return { background: #f0fdf4; color: #15803d; border: none; }
  .btn-return:hover { background: #dcfce7; }
  .btn-icon { width: 28px; height: 28px; padding: 0; border-radius: 6px; background: transparent; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .btn-icon:hover { background: var(--bg); }
  .btn-icon.edit:hover { background: #EFF6FF; }
  .btn-icon.delete:hover { background: #FFF5F5; }
  .btn-full { width: 100%; padding: 11px; border-radius: 10px; }
  .btn:disabled { background: #CBD5E1; cursor: not-allowed; }
</style>
</head>
<body>
    <div id="screen-admin-login" class="screen auth-screen">
  <div style="text-align:center;margin-bottom:0;">
    <div class="auth-title">Library Management System</div>
    <div class="auth-subtitle">Login to your account</div>
  </div>
  <div class="auth-card">
    <h2 style="font-size:17px;font-weight:800;color:var(--text);margin-bottom:20px;">Sign In</h2>
    <form method="POST" class="space-y-4">

    {% csrf_token %}

    <div class="form-group">
        <label class="form-label">Username</label>

        <input
            name="username"
            class="form-input"
            placeholder="Enter username"
            type="text"
        >
    </div>

    <div class="form-group">
        <label class="form-label">Password</label>

        <div class="form-input-wrap">

            <input
                id="admin-password"
                name="password"
                class="form-input"
                placeholder="Enter password"
                type="password"
            >

            <button
                type="button"
                class="input-right-btn"
                onclick="togglePw('admin-password',this)"
            >
                <svg width="16" height="16" viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>

        </div>
    </div>

    <button type="submit" class="btn btn-primary btn-full">
        Sign In
    </button>

</form>

{% if error %}
<div class="alert alert-error" style="margin-top:16px;">
    {{ error }}
</div>
{% endif %}
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);text-align:center;">
      <p style="font-size:12px;color:var(--muted); ">Student? <button style="background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;font-size:12px;" onclick="showScreen('screen-student-login')">Student Login</button></p>
      <p style="font-size:10px;color:#CBD5E1;font-style:italic;"></p>
    </div>
  </div>
</div>
</body>
</html>
