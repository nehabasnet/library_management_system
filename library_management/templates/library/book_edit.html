<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Book — LMS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #e8ddd0;
        font-family: "Segoe UI", sans-serif;
        min-height: 100vh;
      }

      .topbar {
        background: #5c3d2e;
        padding: 12px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .topbar-left .logo-icon {
        width: 36px;
        height: 36px;
        background: #8b5e3c;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1.1rem;
      }
      .topbar-left span {
        font-size: 0.95rem;
        font-weight: 600;
        color: #fff;
      }
      .back-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #8b5e3c;
        border: none;
        padding: 7px 14px;
        border-radius: 8px;
        font-size: 0.82rem;
        color: #fff;
        text-decoration: none;
        transition: background 0.15s;
      }
      .back-btn:hover {
        background: #a0714f;
        color: #fff;
      }

      .page-body {
        max-width: 680px;
        margin: 32px auto;
        padding: 0 20px;
      }

      .form-card {
        background: #fff;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      .form-card h4 {
        font-size: 1.2rem;
        font-weight: 700;
        color: #3d1f0f;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-label {
        font-size: 0.75rem;
        font-weight: 600;
        color: #5c3d2e;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        display: block;
        margin-bottom: 5px;
      }
      .form-input,
      .form-select {
        width: 100%;
        padding: 10px 14px;
        border: 1.5px solid #e0d5c8;
        border-radius: 8px;
        font-size: 0.88rem;
        color: #1a1a2e;
        background: #faf8f5;
        outline: none;
        transition: border-color 0.2s;
      }
      .form-input:focus,
      .form-select:focus {
        border-color: #8b5e3c;
        background: #fff;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .btn-save {
        background: #8b5e3c;
        color: #fff;
        border: none;
        padding: 11px 28px;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-save:hover {
        background: #6b4226;
      }
      .btn-cancel {
        background: #f0e8df;
        color: #5c3d2e;
        border: none;
        padding: 11px 24px;
        border-radius: 8px;
        font-size: 0.9rem;
        text-decoration: none;
        transition: background 0.15s;
      }
      .btn-cancel:hover {
        background: #e0d5c8;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-left">
        <div class="logo-icon"><i class="bi bi-book-half"></i></div>
        <span>Library Management System</span>
      </div>
      <a href="{% url 'book_management' %}" class="back-btn">
        <i class="bi bi-arrow-left"></i> Back to Books
      </a>
    </div>

    <div class="page-body">
      <div class="form-card">
        <h4>
          <i class="bi bi-pencil-square" style="color: #8b5e3c"></i> Edit Book
        </h4>

        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Title *</label>
              <input
                type="text"
                name="title"
                class="form-input"
                value="{{ book.title }}"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Author *</label>
              <input
                type="text"
                name="author"
                class="form-input"
                value="{{ book.author }}"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">ISBN</label>
              <input
                type="text"
                name="isbn"
                class="form-input"
                value="{{ book.isbn }}"
                maxlength="13"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Quantity *</label>
              <input
                type="number"
                name="quantity"
                class="form-input"
                value="{{ book.quantity }}"
                min="0"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Category *</label>
            <select name="category" class="form-select">
              {% for cat in categories %}
              <option
                value="{{ cat.id }}"
                {%
                if
                cat.id=""
                ="book.category.id"
                %}selected{%
                endif
                %}
              >
                {{ cat.name }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea
              name="description"
              class="form-input"
              rows="3"
              style="resize: vertical"
            >
{{ book.description }}</textarea
            >
          </div>

          <!-- Current cover preview -->
          {% if book.get_cover %}
          <div class="form-group">
            <label class="form-label">Current Cover</label>
            <div
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                margin-top: 4px;
              "
            >
              <img
                src="{{ book.get_cover }}"
                alt="cover"
                style="
                  width: 52px;
                  height: 68px;
                  object-fit: cover;
                  border-radius: 6px;
                  border: 1px solid #e0d5c8;
                "
              />
              <span style="font-size: 0.8rem; color: #8b6f5a"
                >Upload a new image below to replace this</span
              >
            </div>
          </div>
          {% endif %}

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Upload New Cover Image</label>
              <input
                type="file"
                name="cover_image"
                class="form-input"
                accept="image/*"
                style="padding: 6px 12px"
              />
            </div>
          </div>
          <div style="display: flex; gap: 12px; margin-top: 8px">
            <button type="submit" class="btn-save">
              <i class="bi bi-check-circle-fill me-1"></i> Save Changes
            </button>
            <a href="{% url 'book_management' %}" class="btn-cancel">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
