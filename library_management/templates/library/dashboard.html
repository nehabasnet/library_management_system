


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — Library Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #e8ddd0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      background: #8a5f41;
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e0e0e0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-left .logo-icon {
      width: 36px;
      height: 36px;
      background: #a77f60;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.1rem;
    }
    .topbar-left span {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      color: #fff;
    }
    .topbar-right .avatar {
      width: 34px;
      height: 34px;
      background: #a77f60;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .topbar-right .breadcrumb-text {
      font-size: 0.8rem;
      color: #fff;
    }

    
    .welcome-section {
      text-align: center;
      padding: 28px 20px 16px;
    }
    .welcome-section .system-name {
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8a5f41;
      margin-bottom: 4px;
    }
    .welcome-section h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #3d1f0f;
      letter-spacing: 3px;
    }

    /* ── Card Grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 8px 28px 40px;
      max-width: 860px;
      margin: 0 auto;
    }

    .dash-card {
      border-radius: 14px;
      padding: 32px 16px 24px;
      text-align: center;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: transform 0.15s, opacity 0.15s;
      cursor: pointer;
    }
    .dash-card:hover {
      transform: translateY(-4px);
      opacity: 0.92;
    }
    .dash-card i {
      font-size: 2.8rem;
      opacity: 0.35;
    }
    .dash-card span {
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* Card colours — warm brown theme matching topbar */
    .card-b1  { background: #8b5e3c; }
    .card-b2  { background: #6b4226; }
    .card-b3  { background: #a0714f; }
    .card-b4  { background: #c49a6c; }
    .card-b5  { background: #7a4f35; }
    .card-b6  { background: #9e7c5a; }
    .card-b7  { background: #4a2e1a; }
    .card-b8  { background: #b8864e; }
    .card-b9  { background: #3d1f0f; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .card-grid {
        grid-template-columns: repeat(2, 1fr);
        padding: 8px 16px 32px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-left">
    <div class="logo-icon"><i class="bi bi-book-half"></i></div>
    <span>Library Management System</span>
  </div>
  <div class="topbar-right">
    <div class="avatar">{{ request.user.username|first|upper }}</div>
    <span>{{ request.user.username }}</span>
    <span class="breadcrumb-text">› Dashboard</span>
  </div>
</div>

<!-- Welcome -->
<div class="welcome-section">
  <p class="system-name">Library Management System</p>
  <h1>WELCOME</h1>
</div>

<!-- Card Grid -->
<div class="card-grid">

  <a href="#" class="dash-card card-b1">
    <i class="bi bi-person-plus-fill"></i>
    <span>Add Members</span>
  </a>

  <a href="#" class="dash-card card-b2">
    <i class="bi bi-people-fill"></i>
    <span>View Members</span>
  </a>

  <a href="#" class="dash-card card-b3">
    <i class="bi bi-journal-plus"></i>
    <span>Add Books</span>
  </a>

  <a href="#" class="dash-card card-b4">
    <i class="bi bi-journals"></i>
    <span>View Books</span>
  </a>

  <a href="#" class="dash-card card-b5">
    <i class="bi bi-arrow-up-right-circle-fill"></i>
    <span>Issued Books</span>
  </a>

  <a href="#" class="dash-card card-b6">
    <i class="bi bi-arrow-counterclockwise"></i>
    <span>Returned Books</span>
  </a>

  <a href="#" class="dash-card card-b7">
    <i class="bi bi-clock-history"></i>
    <span>Book History</span>
  </a>

  <a href="#" class="dash-card card-b8">
    <i class="bi bi-cash-coin"></i>
    <span>Fine Management</span>
  </a>

  <a href="{% url 'logout' %}" class="dash-card card-b9"
     onclick="return confirm('Are you sure you want to sign out?')">
    <i class="bi bi-box-arrow-right"></i>
    <span>Sign Out</span>
  </a>

</div>

</body>
</html>
